server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Air-gap: the browser may only load from this server
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;   # keeps the port: the SSO callback address is built from it
        client_max_body_size 2g;   # PCAP uploads
        proxy_read_timeout 180s;   # local LLM answers can take up to MONICOMM_LLM_TIMEOUT_S
    }

    location / {
        try_files $uri /index.html;
    }
}
