# Fast checks before each commit. Install once:  uv tool install pre-commit && pre-commit install
# The full suite runs in CI and with scripts/check.ps1 (or check.sh).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks  # airgap: allow (dev tool, not shipped)
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit  # airgap: allow (dev tool, not shipped)
    rev: v0.8.6
    hooks:
      - id: ruff-format
        files: ^api/
      - id: ruff
        files: ^api/
  - repo: local
    hooks:
      - id: airgap
        name: air-gap check
        entry: python scripts/check_airgap.py
        language: system
        pass_filenames: false
      - id: web-prettier
        name: prettier (web)
        entry: bash -c "cd web && npx prettier --check ."
        language: system
        files: ^web/
        pass_filenames: false
