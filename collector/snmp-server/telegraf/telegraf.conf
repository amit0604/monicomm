# Telegraf agent for the Monicomm SNMP server. Inputs are generated from templates/ by entrypoint.sh.
[agent]
  interval = "60s"
  round_interval = true
  collection_jitter = "5s"
  flush_interval = "10s"
  flush_jitter = "2s"
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  omit_hostname = true
  skip_processors_after_aggregators = true

# Metrics go to the local Vector shipper, which buffers to disk and forwards to Monicomm over mTLS.
# Note: conversion = "hwaddr" in the templates is deprecated (Telegraf 2.0) but its replacement,
# "displayhint", needs MIB files, which we deliberately don't load. Revisit when moving to Telegraf 2.
[[outputs.socket_writer]]
  address = "tcp://127.0.0.1:9100"
  # Keep retrying if the shipper isn't listening yet (startup order, shipper restart) instead of exiting.
  startup_error_behavior = "retry"
  data_format = "json"
  json_timestamp_units = "1ms"
