# SNMP server shipper (docs/plans/syslog-snmp-deployment.md §2.2)
#   trapd ─► /var/log/trapd/traps-*.jsonl ─┐
#   Telegraf ─► tcp 127.0.0.1:9100 (JSON) ─┼─► disk buffer ─► Monicomm ingest (mTLS)
#   Vector internal metrics (health) ──────┘

data_dir: /var/lib/vector

api:
  enabled: true
  address: 127.0.0.1:8687   # local only: `docker compose exec shipper vector top --url http://127.0.0.1:8687/graphql`

sources:
  traps:
    type: file
    include: [/var/log/trapd/traps-*.jsonl]
    read_from: beginning
    fingerprint:
      strategy: device_and_inode

  telegraf:
    type: socket
    mode: tcp
    address: 127.0.0.1:9100
    decoding:
      codec: json
    framing:
      method: newline_delimited

  collector_metrics:
    type: internal_metrics
    scrape_interval_secs: 60

transforms:
  traps_norm:
    type: remap
    inputs: [traps]
    source: |
      parsed, err = parse_json(.message)
      if err != null || !is_object(parsed) {
        . = {"schema": "monicomm.trap.v1", "kind": "trap", "parse_error": err, "raw": .message}
      } else {
        . = object!(parsed)
      }
      .collector_id = "${COLLECTOR_ID}"

  metrics_norm:
    type: remap
    inputs: [telegraf]
    source: |
      . = {
        "schema": "monicomm.snmp_metric.v1",
        "kind": "snmp_metric",
        "collector_id": "${COLLECTOR_ID}",
        "source_ip": .tags.source,
        "measurement": .name,
        "tags": .tags,
        "fields": .fields,
        "polled_at": .timestamp
      }

  health_filter:
    type: filter
    inputs: [collector_metrics]
    condition: |
      includes([
        "component_received_events_total",
        "component_sent_events_total",
        "component_discarded_events_total",
        "component_errors_total",
        "buffer_byte_size",
        "buffer_events",
        "buffer_discarded_events_total"
      ], .name)

  health:
    type: remap
    inputs: [health_filter]
    source: |
      .tags.collector_id = "${COLLECTOR_ID}"

sinks:
  to_monicomm:
    type: vector
    inputs: [traps_norm, metrics_norm, health]
    address: ${MONICOMM_INGEST_ADDRESS}
    healthcheck:
      enabled: false          # start and buffer even when Monicomm is down
    tls:
      enabled: true
      ca_file: /etc/monicomm/certs/ca.crt
      crt_file: /etc/monicomm/certs/collector.crt
      key_file: /etc/monicomm/certs/collector.key
      verify_certificate: true
      verify_hostname: true
    buffer:
      type: disk
      max_size: ${FORWARD_BUFFER_BYTES}
      when_full: block        # trap files and Telegraf's own buffer hold data while this is full
