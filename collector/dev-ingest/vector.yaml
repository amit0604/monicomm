# Stand-in for Monicomm's `ingest` service until the Monicomm stack exists.
# Accepts collector traffic on TCP 6000 (mTLS, client cert required) and writes it to JSON files
# so the syslog and SNMP servers can be set up and checked end to end now.

data_dir: /var/lib/vector

sources:
  collectors:
    type: vector
    address: 0.0.0.0:6000
    tls:
      enabled: true
      ca_file: /etc/monicomm/certs/ca.crt
      crt_file: /etc/monicomm/certs/ingest.crt
      key_file: /etc/monicomm/certs/ingest.key
      verify_certificate: true   # require a client certificate signed by our CA

transforms:
  health_as_log:
    type: metric_to_log
    inputs: [collectors]

sinks:
  events:
    type: file
    inputs: [collectors]
    path: /data/%Y-%m-%d/{{ kind }}.jsonl
    encoding:
      codec: json

  health:
    type: file
    inputs: [health_as_log]
    path: /data/%Y-%m-%d/collector_health.jsonl
    encoding:
      codec: json
