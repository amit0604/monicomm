# Dev/test receiver that stands in for Monicomm `ingest` (TCP 6000, mTLS). Not for production.
# Run it on the future Monicomm VM (or any VM the collectors can reach), then:
#   tail -f data/$(date -u +%F)/syslog.jsonl
name: moni-dev-ingest

services:
  vector:
    image: timberio/vector:0.61.0-debian@sha256:f6c23b5a7e16fb2838d33619ef7acf4bad2289a7cf22bc90efc2371f520c4ea2
    command: ["--config", "/etc/vector/vector.yaml"]
    restart: unless-stopped
    ports:
      - "6000:6000"
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ../certs:/etc/monicomm/certs:ro
      - ./data:/data
      - buffer:/var/lib/vector

volumes:
  buffer:
